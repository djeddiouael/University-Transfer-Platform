
name: Security Audit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - Final

permissions:
  contents: read

jobs:
  npm-audit:
    name: Audit npm dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check npm vulnerabilities
        run: npm audit --audit-level=critical

  composer-audit:
    name: Audit Composer dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Check Composer dependencies
        run: composer audit
