
name: Fix Guzzle Security Vulnerability

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-guzzle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Update Guzzle
        run: |
          composer update guzzlehttp/guzzle --with-dependencies --no-interaction --prefer-dist --no-audit

      - name: Verify Guzzle version
        run: |
          composer show guzzlehttp/guzzle
          php -r '
          require "vendor/autoload.php";
          $v = Composer\InstalledVersions::getVersion("guzzlehttp/guzzle");
          echo "Installed Guzzle version: $v\n";
          if (version_compare($v, "7.15.2", "<")) {
              fwrite(STDERR, "Guzzle is still vulnerable.\n");
              exit(1);
          }
          '

      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: composer audit

      - name: Commit updated lock file
        run: |
          if ! git diff --quiet -- composer.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add composer.lock
            git commit -m "fix: update Guzzle security dependency"
            git push
          else
            echo "No composer.lock changes detected"
          fi
