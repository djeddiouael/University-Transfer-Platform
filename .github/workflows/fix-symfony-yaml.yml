
name: Fix Symfony YAML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-yaml:
    name: Update Symfony YAML dependency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: Final

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Validate Composer files
        run: composer validate --no-check-publish

      - name: Update Symfony YAML
        run: composer update symfony/yaml -W --no-interaction --prefer-dist --no-progress

      - name: Verify installed version
        run: |
          composer show symfony/yaml
          composer audit

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock

          if ! git diff --cached --quiet; then
            git commit -m "fix: update Symfony YAML dependency"
            git push origin HEAD:Final
          else
            echo "No composer.lock changes to commit"
          fi
