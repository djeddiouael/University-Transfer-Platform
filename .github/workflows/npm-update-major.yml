name: NPM Update Major

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update major packages
        run: |
          npm install --save-dev webpack@latest @babel/traverse@latest svgo@latest json5@latest serialize-javascript@latest source-map-js@latest || true
          npm install --save axios@latest lodash@latest ws@latest body-parser@latest node-forge@latest || true

      - name: Run audit fix again
        run: npm audit fix || true

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git diff --cached --quiet || git commit -m "chore: update major npm packages to fix vulnerabilities"
          git push
