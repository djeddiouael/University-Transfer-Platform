name: Fix npm Security

'on':
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-npm:
    name: Fix compatible npm vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Final
        uses: actions/checkout@v4
        with:
          ref: Final
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply compatible security fixes
        run: npm audit fix
        continue-on-error: true

      - name: Check remaining vulnerabilities
        run: npm audit
        continue-on-error: true

      - name: Build frontend
        run: npm run prod --if-present

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: Final
          branch: security/npm-audit-fixes
          delete-branch: true
          title: 'security: fix compatible npm vulnerabilities'
          commit-message: 'security: update vulnerable npm dependencies'
          body: |
            ## Summary
            - Apply compatible npm security updates.
            - Report remaining npm vulnerabilities.
            - Build the frontend before proposing changes.

            ## Review required
            - Review package-lock.json changes.
            - Check remaining npm audit findings.
            - Run application tests before merging.
          add-paths: |
            package-lock.json
            package.json
