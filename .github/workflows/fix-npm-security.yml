
name: Fix npm Security

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-npm:
    name: Fix npm vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Final
        uses: actions/checkout@v4
        with:
          ref: Final

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply compatible security fixes
        run: npm audit fix
        continue-on-error: true

      - name: Report remaining vulnerabilities
        run: npm audit
        continue-on-error: true

      - name: Verify dependency versions
        run: npm ls laravel-mix webpack webpack-cli || true

      - name: Update lockfile if needed
        run: |
          npm install --package-lock-only --ignore-scripts
        continue-on-error: true

      - name: Show dependency changes
        run: |
          git status --short
          git diff --stat
          git diff -- package.json package-lock.json

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: Final
          branch: security/npm-audit-fixes
          delete-branch: false
          title: 'security: update npm dependencies'
          commit-message: 'security: update npm dependency lockfile'
          body: |
            ## Security dependency review

            - Attempt compatible npm security fixes.
            - Report remaining audit findings.
            - Review dependency and lockfile changes.
            - Verify Laravel Mix and webpack compatibility
              before merging.
          add-paths: |
            package.json
            package-lock.json
