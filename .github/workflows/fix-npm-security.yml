
name: Fix npm Security

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-npm:
    name: Repair lockfile and audit dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Final
        uses: actions/checkout@v4
        with:
          ref: Final

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Repair package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Install dependencies
        run: npm ci

      - name: Apply compatible security fixes
        run: npm audit fix
        continue-on-error: true

      - name: Check remaining vulnerabilities
        run: npm audit
        continue-on-error: true

      - name: Check Laravel Mix and webpack
        run: npm ls laravel-mix webpack webpack-cli || true

      - name: Build frontend
        run: npm run prod --if-present

      - name: Create pull request
        if: always()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: Final
          branch: security/npm-audit-fixes
          delete-branch: false
          title: 'security: repair npm lockfile and update dependencies'
          commit-message: 'security: repair npm lockfile'
          body: |
            Repairs the npm lockfile and attempts compatible
            security updates.

            Review the audit report and verify the frontend build
            before merging.
          add-paths: |
            package.json
            package-lock.json
