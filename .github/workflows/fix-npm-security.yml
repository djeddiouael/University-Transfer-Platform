
name: Fix npm Security

'on':
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-npm:
    name: Fix npm vulnerabilities and check build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Final
        uses: actions/checkout@v4
        with:
          ref: Final

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply compatible security fixes
        run: npm audit fix
        continue-on-error: true

      - name: Check remaining vulnerabilities
        run: npm audit
        continue-on-error: true

      - name: Check installed dependency versions
        run: |
          npm ls laravel-mix webpack webpack-cli --depth=1 || true

      - name: Build frontend
        run: npm run prod --if-present

      - name: Create pull request
        if: always()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: Final
          branch: security/npm-audit-fixes
          delete-branch: true
          title: 'security: fix compatible npm dependencies'
          commit-message: 'security: update npm dependencies'
          body: |
            ## Summary
            - Apply compatible npm security fixes.
            - Check installed Laravel Mix and webpack versions.
            - Attempt the production frontend build.

            ## Review required
            - Review package-lock.json changes.
            - Check remaining npm audit findings.
            - Confirm the production build passes before merging.
          add-paths: |
            package.json
            package-lock.json
