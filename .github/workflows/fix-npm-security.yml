```yaml
name: Fix npm Security

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-npm:
    name: Repair dependencies and audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Final
        uses: actions/checkout@v4
        with:
          ref: Final

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Validate package files
        run: |
          test -f package.json
          test -f package-lock.json
          node --version
          npm --version

      - name: Inspect vulnerable dependencies
        run: |
          npm ls laravel-mix webpack webpack-cli elliptic node-forge || true
          npm explain elliptic || true
          npm explain node-forge || true

      - name: Install dependencies
        run: npm ci

      - name: Apply compatible security fixes
        run: npm audit fix --no-fund

      - name: Build frontend
        run: npm run prod --if-present

      - name: Audit remaining vulnerabilities
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e "
            const fs = require('fs');
            const report = JSON.parse(
              fs.readFileSync('npm-audit-report.json', 'utf8')
            );
            console.log('Remaining vulnerabilities:');
            console.log(JSON.stringify(
              report.metadata?.vulnerabilities ?? {},
              null,
              2
            ));
            console.log('Detailed audit report saved.');
          "

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Create pull request
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: Final
          branch: security/npm-audit-fixes
          delete-branch: false
          title: "security: update npm dependencies"
          commit-message: "security: update npm dependencies"
          body: |
            Automated npm dependency maintenance.

            - Applies compatible security updates.
            - Checks the Laravel Mix production build.
            - Includes an npm audit report as a workflow artifact.

            Review remaining vulnerabilities before merging.
          add-paths: |
            package.json
            package-lock.json

      - name: Final status
        if: always()
        run: |
          echo "Workflow finished."
          echo "Review the build, audit report, and pull request status."
```
