
name: Fix npm Security

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-npm:
    name: Repair lockfile and audit dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Final
        uses: actions/checkout@v4
        with:
          ref: Final

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Validate package files
        run: |
          test -f package.json
          test -f package-lock.json
          npm --version
          node --version

      - name: Install dependencies
        run: npm ci

      - name: Apply compatible security fixes
        run: npm audit fix --no-fund

      - name: Check dependency tree
        run: npm ls laravel-mix webpack webpack-cli elliptic node-forge || true

      - name: Run production build
        run: npm run prod --if-present

      - name: Audit remaining vulnerabilities
        run: npm audit

      - name: Create pull request
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: Final
          branch: security/npm-audit-fixes
          delete-branch: false
          title: 'security: repair npm dependencies'
          commit-message: 'security: update npm dependencies'
          body: |
            Updates compatible npm dependencies and the lockfile.
            The workflow must pass the production build and npm audit
            before creating this pull request.
          add-paths: |
            package.json
            package-lock.json
